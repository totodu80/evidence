<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — ÉVIDENCE</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #14243f;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 25px;
      background: #101d35;
      border: 1px solid #d6ae68;
      border-radius: 18px;
    }

    h1, h2 {
      color: #d6ae68;
    }

    button {
      padding: 12px 18px;
      background: #d6ae68;
      color: #101d35;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <h1>🛡️ Administration ÉVIDENCE</h1>
    <p>Espace réservé à la modération des membres.</p>

    <section id="verification">
      <p>Vérification des droits administrateur à venir…</p>
    </section>

    <section id="moderation" hidden>
      <h2>📸 Modération des photos</h2>
      <div id="liste-photos"></div>
    </section>
  </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://igzexxjobstgsrmfgldg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WWC1UZCeMSZu1Yacawquew_MzPJWup_";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function verifierAdministrateur() {
    const verification = document.getElementById("verification");
    const moderation = document.getElementById("moderation");

    verification.textContent = "Vérification de votre accès…";
    moderation.hidden = true;

    try {
      const { data: sessionData, error: sessionError } =
        await db.auth.getUser();

      if (sessionError || !sessionData.user) {
        verification.textContent =
          "🔒 Accès réservé. Connectez-vous à ÉVIDENCE.";
        return;
      }

      const { data: autorise, error } =
        await db.rpc("est_administrateur");

      if (error || autorise !== true) {
        verification.textContent =
          "⛔ Accès refusé : vous n'êtes pas administrateur.";
        return;
      }

      verification.textContent = "✅ Accès administrateur autorisé.";
      moderation.hidden = false;

    } catch (erreur) {
      verification.textContent =
        "Impossible de vérifier les droits administrateur.";
      console.error(erreur);
    }
  }

  verifierAdministrateur();
</script>
</body>
</html>
