<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil d'un membre - ÉVIDENCE</title>
  <style>
  body {
    background-color: #0b1736;
    color: #d4af37;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
  }
</style>
</head>
<body>
  <h1>ÉVIDENCE 💛</h1>
  <h2>Profil du membre</h2>
  <div id="informations-profil">
  <p>Chargement du profil...</p>
</div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabaseUrl = 'https://igzexxjobstgsrmfqldg.supabase.co';
    const supabaseKey = 'sb_publishable_WWC1UZCeMSZu1Yacawquew_MzPJWup_';
    const client = createClient(supabaseUrl, supabaseKey);
    const { data: { user }, error } = await client.auth.getUser();

if (error || !user) {
  document.getElementById('informations-profil').textContent =
    'Connecte-toi pour consulter les profils.';
}
    const parametres = new URLSearchParams(window.location.search);
const membreId = parametres.get('id');
    if (!membreId) {
  document.getElementById('informations-profil').textContent =
    'Aucun profil sélectionné.';
}
    if (!user || !membreId) {
  throw new Error('Consultation du profil impossible.');
}
    const { data: profil, error: erreurProfil } = await client
  .from('profils')
  .select('*')
  .eq('id', membreId)
  .eq('profil_visible', true)
  .maybeSingle();
    if (erreurProfil || !profil) {
  document.getElementById('informations-profil').textContent =
    'Ce profil est introuvable ou non visible.';
  throw new Error('Profil inaccessible.');
}
    const { data: blocage, error: erreurBlocage } = await client
  .rpc('sont_bloques', {
    membre_a: user.id,
    membre_b: membreId
  });
    if (erreurBlocage || blocage !== false) {
  document.getElementById('informations-profil').textContent =
    'Ce profil n’est pas accessible.';
  throw new Error('Accès au profil refusé.');
}
    const zoneProfil = document.getElementById('informations-profil');
zoneProfil.replaceChildren();

const pseudo = document.createElement('h3');
pseudo.textContent = profil.pseudo || 'Membre ÉVIDENCE';

zoneProfil.appendChild(pseudo);
    const zonePhoto = document.createElement('div');
zonePhoto.style.margin = '20px auto';

zoneProfil.appendChild(zonePhoto);
    const { data: photos, error: erreurPhotos } = await client
  .from('photos_profils')
  .select('chemin, est_principale')
  .eq('membre_id', membreId)
  .eq('statut', 'approuvee')
  .order('est_principale', { ascending: false })
  .limit(1);
    if (!erreurPhotos && photos && photos.length > 0) {
  const photo = photos[0];

  const { data: fichier, error: erreurImage } = await client.storage
    .from('photos-profils')
    .download(photo.chemin);
if (!erreurImage && fichier) {
  const image = document.createElement('img');
  const url = URL.createObjectURL(fichier);

  image.src = url;
  image.alt = 'Photo approuvée du membre';
  image.style.width = '220px';
  image.style.height = '220px';
  image.style.objectFit = 'cover';
  image.style.borderRadius = '15px';
  image.style.border = '2px solid #D4AF37';

  image.onload = () => URL.revokeObjectURL(url);

  zonePhoto.appendChild(image);
}
}
    const region = document.createElement('p');
region.textContent = '📍 Région : ' + (profil.region || 'Non renseignée');

zoneProfil.appendChild(region);
    const presentation = document.createElement('p');
presentation.textContent = '❤️ Présentation : ' +
  (profil.presentation || 'Non renseignée');

zoneProfil.appendChild(presentation);
    const interets = document.createElement('p');
interets.textContent = '💛 Centres d’intérêt : ' +
  (profil.centres_interet || 'Non renseignés');

zoneProfil.appendChild(interets);
    const boutonMessage = document.createElement('button');
boutonMessage.textContent = '💌 Envoyer un message';
boutonMessage.style.backgroundColor = '#D4AF37';
boutonMessage.style.color = '#0b1736';
boutonMessage.style.padding = '12px 20px';
boutonMessage.style.border = 'none';
boutonMessage.style.borderRadius = '10px';
boutonMessage.style.cursor = 'pointer';
boutonMessage.disabled = true;
boutonMessage.title = 'Messagerie bientôt disponible';
zoneProfil.appendChild(boutonMessage);
    const retour = document.createElement('a');
retour.href = 'decouvrir.html';
retour.textContent = '← Retour aux membres';
retour.style.color = '#D4AF37';
retour.style.display = 'block';
retour.style.marginTop = '30px';

zoneProfil.appendChild(retour);
</script>
</body>
</html>
